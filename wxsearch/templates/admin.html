<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微信搜一搜采集 · 后台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif;
           background: #f4f6f9; color: #222; }
    header { background: #07c160; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    .wrap { max-width: 960px; margin: 20px auto; padding: 0 16px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 18px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card.full { grid-column: 1 / -1; }
    h2 { margin: 0 0 14px; font-size: 15px; color: #07c160; }
    label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d8dde3;
            border-radius: 6px; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 88px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px;
           cursor: pointer; color: #fff; background: #07c160; }
    .btn:disabled { background: #9ad9b7; cursor: not-allowed; }
    .btn.gray { background: #6b7280; }
    .btn.blue { background: #2b6cff; }
    .bar { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .hint { font-size: 12px; color: #8a94a6; margin-top: 6px; }
    #toast { position: fixed; top: 16px; right: 16px; background: #333; color: #fff;
             padding: 10px 16px; border-radius: 6px; opacity: 0; transition: .3s; pointer-events: none; }
    #toast.show { opacity: .95; }
    .status { font-size: 13px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
           background: #bbb; margin-right: 6px; vertical-align: middle; }
    .dot.on { background: #07c160; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    #logs { background: #0f172a; color: #cbd5e1; font-family: Consolas, monospace;
            font-size: 12px; line-height: 1.6; border-radius: 8px; padding: 12px;
            height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <header>微信搜一搜采集 · 后台设置</header>
  <div class="wrap">

    <div class="card">
      <h2>关键词</h2>
      <label>每行一个，或用逗号分隔</label>
      <textarea id="keywords" placeholder="评选征集&#10;人工智能"></textarea>
      <div class="hint">这些关键词会被依次搜索并采集。</div>
    </div>

    <div class="card">
      <h2>筛选条件</h2>
      <label>排序</label>
      <select id="f_sort">
        <option value="">不设置</option>
        <option>综合排序</option><option>最新</option><option>最热</option>
      </select>
      <label>类型</label>
      <select id="f_type">
        <option value="">不设置</option>
        <option>不限</option><option>文章</option><option>视频</option>
      </select>
      <div class="row">
        <div>
          <label>时间</label>
          <select id="f_time">
            <option value="">不设置</option>
            <option>不限</option><option>最近一天</option>
            <option>最近七天</option><option>最近半年</option>
          </select>
        </div>
        <div>
          <label>范围</label>
          <select id="f_scope">
            <option value="">不设置</option>
            <option>不限</option><option>已关注</option>
            <option>最近看过</option><option>朋友赞过</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card full">
      <h2>采集参数</h2>
      <div class="row">
        <div>
          <label>每个关键词最多采集条数</label>
          <input id="c_max_items" type="number" min="1" />
        </div>
        <div>
          <label>最大滚动次数</label>
          <input id="c_max_scrolls" type="number" min="1" />
        </div>
        <div>
          <label>滚动间隔（秒）</label>
          <input id="c_scroll_pause" type="number" step="0.1" min="0" />
        </div>
        <div>
          <label>连续无新结果停止轮数</label>
          <input id="c_no_new" type="number" min="1" />
        </div>
      </div>
      <div class="bar">
        <button class="btn" id="saveBtn">保存设置</button>
        <button class="btn blue" id="startBtn">开始采集</button>
        <span class="status"><span class="dot" id="dot"></span><span id="statusText">空闲</span></span>
        <span class="status" id="statTotal"></span>
      </div>
      <div class="hint">保存后立即生效；命令行 <code>python main.py</code> 与本后台共用同一份 config.json。</div>
    </div>

    <div class="card full">
      <h2>实时日志</h2>
      <div id="logs">（尚无日志）</div>
    </div>

  </div>
  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let polling = null;

    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function setSelect(el, val) {
      el.value = val || "";
      if (val && el.value !== val) {
        const opt = document.createElement("option");
        opt.value = val; opt.textContent = val; el.appendChild(opt); el.value = val;
      }
    }

    async function loadConfig() {
      const c = await (await fetch("/api/config")).json();
      $("keywords").value = (c.keywords || []).join("\n");
      setSelect($("f_sort"), c.filters.sort);
      setSelect($("f_type"), c.filters.type);
      setSelect($("f_time"), c.filters.time);
      setSelect($("f_scope"), c.filters.scope);
      $("c_max_items").value = c.collect.max_items_per_keyword;
      $("c_max_scrolls").value = c.collect.max_scrolls;
      $("c_scroll_pause").value = c.collect.scroll_pause_sec;
      $("c_no_new").value = c.collect.stop_after_no_new_rounds;
      loadStats();
    }

    async function loadStats() {
      const s = await (await fetch("/api/stats")).json();
      $("statTotal").textContent = "数据库累计 " + s.total + " 条";
    }

    function gather() {
      return {
        keywords: $("keywords").value,
        filters: {
          sort: $("f_sort").value, type: $("f_type").value,
          time: $("f_time").value, scope: $("f_scope").value,
        },
        collect: {
          max_items_per_keyword: $("c_max_items").value,
          max_scrolls: $("c_max_scrolls").value,
          scroll_pause_sec: $("c_scroll_pause").value,
          stop_after_no_new_rounds: $("c_no_new").value,
        },
      };
    }

    async function save() {
      const r = await fetch("/api/config", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(gather()),
      });
      if (r.ok) { toast("已保存"); loadConfig(); } else { toast("保存失败"); }
    }

    async function start() {
      await save();
      const r = await fetch("/api/collect/start", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const d = await r.json();
      if (r.status === 409 || !d.ok) { toast("采集进行中"); return; }
      toast("已启动采集");
      startPolling();
    }

    function renderStatus(s) {
      const running = s.running;
      $("dot").classList.toggle("on", running);
      $("statusText").textContent = running
        ? ("采集中… 开始于 " + s.started_at)
        : (s.finished_at ? ("已结束 " + s.finished_at) : "空闲");
      $("startBtn").disabled = running;
      const logs = (s.logs && s.logs.length) ? s.logs.join("\n") : "（尚无日志）";
      const box = $("logs");
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
      box.textContent = logs;
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    function startPolling() {
      if (polling) return;
      polling = setInterval(async () => {
        const s = await (await fetch("/api/collect/status")).json();
        renderStatus(s);
        if (!s.running) { clearInterval(polling); polling = null; loadStats(); }
      }, 1500);
    }

    $("saveBtn").onclick = save;
    $("startBtn").onclick = start;
    loadConfig();
    // 页面加载时若采集仍在进行，恢复轮询
    fetch("/api/collect/status").then(r => r.json()).then(s => {
      renderStatus(s); if (s.running) startPolling();
    });
  </script>
</body>
</html>
