<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>设备监控 - 微信搜一搜采集器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --panel:#1e293b; --panel-2:#243449; --border:#334155;
      --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
      --brand:#149f90; --brand-hover:#2dd4bf; --danger:#f87171; --warn:#fbbf24; --ok:#34d399;
      --radius-card:12px; --radius-btn:8px; --shadow:0 1px 2px rgba(2,6,23,0.4);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; font-size:15px; background:var(--bg); color:var(--text); }
    h1,h2,h3,.sidebar-header { font-family:"Sora","Noto Sans SC",sans-serif; }
    .sidebar { width:240px; background:var(--panel); min-height:100vh; position:fixed; left:0; top:0; border-right:1px solid var(--border); }
    .sidebar-header { padding:20px; font-size:18px; font-weight:600; border-bottom:1px solid var(--border); }
    .sidebar-menu { list-style:none; padding:20px 0; }
    .sidebar-menu a { display:block; text-decoration:none; }
    .sidebar-menu li { padding:12px 20px; cursor:pointer; transition:all .2s; border-left:3px solid transparent; color:var(--text-2); }
    .sidebar-menu li:hover { background:var(--panel-2); border-left-color:var(--brand); color:var(--text); }
    .sidebar-menu li.active { background:rgba(20,159,144,.15); border-left-color:var(--brand); color:var(--brand-hover); }
    .main-content { margin-left:240px; padding:30px; }
    .header { background:var(--panel); padding:20px 30px; border-radius:var(--radius-card); box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    .header h1 { font-size:24px; }
    .header .subtitle { font-size:14px; color:var(--text-2); margin-top:6px; }
    .btn { padding:8px 16px; border:none; border-radius:var(--radius-btn); cursor:pointer; font-size:14px; background:var(--panel-2); color:var(--text-2); border:1px solid var(--border); font-family:inherit; }
    .btn:hover { background:#2f435c; color:var(--text); }
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:24px; }
    .stat-card { background:var(--panel); padding:22px; border-radius:var(--radius-card); box-shadow:var(--shadow); border:1px solid var(--border); }
    .stat-card h3 { font-size:14px; color:var(--text-2); margin-bottom:8px; font-weight:500; }
    .stat-card .number { font-size:30px; font-weight:700; }
    .stat-card.green { border-left:4px solid var(--ok); }
    .stat-card.blue { border-left:4px solid #38bdf8; }
    .stat-card.orange { border-left:4px solid var(--warn); }
    .stat-card.red { border-left:4px solid var(--danger); }
    .table-container { background:var(--panel); border-radius:var(--radius-card); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; }
    .table-header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .table-header h2 { font-size:18px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--text-2); font-weight:600; }
    td { color:var(--text-2); }
    tr:hover td { background:rgba(148,163,184,.06); color:var(--text); }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
    .dot-on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
    .dot-off { background:var(--text-3); }
    .badge { padding:3px 9px; border-radius:6px; font-size:12px; font-weight:500; display:inline-block; }
    .badge-ok { background:rgba(52,211,153,.15); color:#6ee7b7; }
    .badge-muted { background:rgba(148,163,184,.15); color:#cbd5e1; }
    .badge-warn { background:rgba(251,191,36,.15); color:#fcd34d; }
    .badge-danger { background:rgba(248,113,113,.15); color:#fca5a5; }
    .kw-link { color:var(--brand-hover); cursor:pointer; }
    .kw-link:hover { text-decoration:underline; }
    .modal { display:none; position:fixed; inset:0; background:rgba(2,6,23,.7); z-index:1000; }
    .modal.show { display:flex; justify-content:center; align-items:center; }
    .modal-content { background:var(--panel); padding:24px; border-radius:var(--radius-card); border:1px solid var(--border); width:640px; max-width:92%; max-height:82vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .close-btn { background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-3); }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:5px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">🎯 线索管理系统</div>
    <ul class="sidebar-menu" id="sidebarMenu">
      <a href="/admin"><li>线索列表</li></a>
      <a href="/admin/keywords"><li>数据优化</li></a>
      <a href="/admin/collection"><li>采集设置</li></a>
      <a href="/admin/devices"><li class="active">设备监控</li></a>
      <a href="/admin/settings"><li>系统设置</li></a>
    </ul>
  </div>

  <div class="main-content">
    <div class="header">
      <div>
        <h1>设备监控</h1>
        <p class="subtitle">各采集设备在线状态、当前在采关键词、今日采集量与健康度（每 10 秒自动刷新）。</p>
      </div>
      <button class="btn" onclick="loadAll()">🔄 刷新</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card green"><h3>在线设备</h3><div class="number" id="cOnline">-</div></div>
      <div class="stat-card blue"><h3>设备总数</h3><div class="number" id="cTotal">-</div></div>
      <div class="stat-card orange"><h3>今日采集量</h3><div class="number" id="cArticles">-</div></div>
      <div class="stat-card red"><h3>异常设备</h3><div class="number" id="cAbnormal">-</div></div>
    </div>

    <div class="table-container">
      <div class="table-header"><h2>设备列表</h2><span style="color:var(--text-3); font-size:13px;">点设备名看它采过的关键词</span></div>
      <table>
        <thead>
          <tr>
            <th>设备</th><th>类型</th><th>渠道</th><th>状态</th><th>当前在采</th>
            <th class="num">今日任务</th><th class="num">今日采集</th><th class="num">成功/失败</th>
            <th class="num">连续失败</th><th>最近上报</th>
          </tr>
        </thead>
        <tbody id="devBody"><tr><td colspan="10" style="text-align:center;color:var(--text-3);">加载中...</td></tr></tbody>
      </table>
    </div>

    <!-- 日志监控：微信搜一搜调度日志 -->
    <div class="table-container" style="margin-top:20px;">
      <div class="table-header" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <h2 style="margin:0;">调度日志</h2>
        <span style="color:var(--text-3); font-size:13px;">全渠道关键词的调度与运行日志（每 10 秒刷新）</span>
        <span style="flex:1;"></span>
        <select id="logStatus" onchange="loadLogs(true)" style="padding:6px 10px; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:13px;">
          <option value="">全部状态</option>
          <option value="completed">成功</option>
          <option value="failed">失败</option>
        </select>
        <select id="logChannel" onchange="loadLogs(true)" style="padding:6px 10px; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:13px;">
          <option value="">全部渠道</option>
        </select>
        <label style="display:flex; align-items:center; gap:5px; color:var(--text-2); font-size:13px;"><input type="checkbox" id="logAuto" checked> 自动滚到底</label>
      </div>
      <div id="logBox" style="max-height:420px; overflow-y:auto; background:#0b1220; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-family:'Consolas','Monaco',monospace; font-size:12px; line-height:1.7;">
        <div style="color:var(--text-3); text-align:center; padding:20px;">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 设备关键词下钻弹窗 -->
  <div class="modal" id="kwModal">
    <div class="modal-content">
      <div class="modal-header"><h2 id="kwTitle">设备采集关键词</h2><button class="close-btn" onclick="closeKw()">&times;</button></div>
      <table>
        <thead><tr><th>关键词</th><th class="num">任务</th><th class="num">采集条数</th><th class="num">成功/失败</th><th>最近时间</th></tr></thead>
        <tbody id="kwBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api/v1';

    function fmtTime(v){ if(!v) return '-'; try { return new Date(v).toLocaleString('zh-CN'); } catch(e){ return v; } }
    function esc(t){ const d=document.createElement('div'); d.textContent = t==null?'':String(t); return d.innerHTML; }

    async function loadAll(){
      try {
        const resp = await fetch(`${API_BASE}/devices`);
        if(!resp.ok) throw new Error('加载失败');
        const j = await resp.json();
        const s = j.summary || {};
        document.getElementById('cOnline').textContent = s.online ?? 0;
        document.getElementById('cTotal').textContent = s.total ?? 0;
        document.getElementById('cArticles').textContent = s.today_articles ?? 0;
        document.getElementById('cAbnormal').textContent = s.abnormal ?? 0;
        renderDevices(j.data || []);
      } catch(e){
        console.error(e);
        document.getElementById('devBody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--danger);">加载设备失败</td></tr>';
      }
    }

    function renderDevices(rows){
      const body = document.getElementById('devBody');
      if(!rows.length){ body.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-3);">暂无设备（采集器上报心跳后出现）</td></tr>'; return; }
      body.innerHTML = rows.map(d => {
        const online = d.is_online === true;
        const statusHtml = online
          ? '<span class="dot dot-on"></span><span class="badge badge-ok">在线</span>'
          : '<span class="dot dot-off"></span><span class="badge badge-muted">离线</span>';
        const fs = Number(d.fail_streak||0);
        const fsHtml = fs >= 3 ? `<span class="badge badge-danger">${fs}</span>` : (fs>0 ? `<span class="badge badge-warn">${fs}</span>` : '0');
        const typ = d.device_type === 'phone' ? '📱 手机' : '💻 PC';
        return `<tr>
          <td><span class="kw-link" onclick="openKw('${esc(d.device_id)}')">${esc(d.device_id)}</span></td>
          <td>${typ}</td>
          <td>${esc(d.channel||'-')}</td>
          <td>${statusHtml}</td>
          <td>${esc(d.current_keyword||'—')}</td>
          <td class="num">${d.today_tasks||0}</td>
          <td class="num">${d.today_articles||0}</td>
          <td class="num">${d.today_success||0}/${d.today_fail||0}</td>
          <td class="num">${fsHtml}</td>
          <td>${fmtTime(d.last_report)}</td>
        </tr>`;
      }).join('');
    }

    async function openKw(deviceId){
      document.getElementById('kwTitle').textContent = `「${deviceId}」采集的关键词`;
      const body = document.getElementById('kwBody');
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-3);">加载中...</td></tr>';
      document.getElementById('kwModal').classList.add('show');
      try {
        const resp = await fetch(`${API_BASE}/devices/${encodeURIComponent(deviceId)}/keywords`);
        const j = await resp.json();
        const rows = j.data || [];
        if(!rows.length){ body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-3);">该设备暂无采集记录</td></tr>'; return; }
        body.innerHTML = rows.map(r => `<tr>
          <td>${esc(r.keyword)}</td><td class="num">${r.tasks||0}</td><td class="num">${r.articles||0}</td>
          <td class="num">${r.success||0}/${r.fail||0}</td><td>${fmtTime(r.last_time)}</td>
        </tr>`).join('');
      } catch(e){
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger);">加载失败</td></tr>';
      }
    }
    function closeKw(){ document.getElementById('kwModal').classList.remove('show'); }
    document.getElementById('kwModal').addEventListener('click', e => { if(e.target.id==='kwModal') closeKw(); });

    // ===== 调度日志（全渠道关键词）=====
    const LEVEL_COLOR = { ERROR:'#f87171', CRITICAL:'#f87171', WARNING:'#fbbf24', INFO:'#94a3b8', DEBUG:'#64748b' };
    let _logChanInit = false;
    function fillLogChannels(chans){
      if(_logChanInit || !chans || !chans.length) return;
      const sel = document.getElementById('logChannel');
      chans.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
      _logChanInit = true;
    }
    async function loadLogs(reset){
      const box = document.getElementById('logBox');
      const status = document.getElementById('logStatus').value;
      const channel = document.getElementById('logChannel').value;
      const params = new URLSearchParams({ limit: 300 });
      if(status) params.append('status', status);
      if(channel) params.append('channel', channel);
      try {
        const resp = await fetch(`${API_BASE}/schedule_logs?${params.toString()}`);
        if(!resp.ok){ box.innerHTML = '<div style="color:var(--danger);text-align:center;padding:20px;">日志加载失败（需管理员权限）</div>'; return; }
        const j = await resp.json();
        fillLogChannels(j.channels || []);
        const logs = j.logs || [];
        if(!logs.length){ box.innerHTML = '<div style="color:var(--text-3);text-align:center;padding:20px;">暂无日志</div>'; return; }
        box.innerHTML = logs.map(l => {
          const c = LEVEL_COLOR[(l.level||'INFO').toUpperCase()] || '#94a3b8';
          return `<div style="white-space:pre-wrap; word-break:break-all; margin-bottom:2px;"><span style="color:#475569;">${fmtTime(l.created_at)}</span> <span style="color:${c}; font-weight:600;">[${esc(l.level||'INFO')}]</span> <span style="color:#a78bfa;">${esc(l.channel||'-')}</span> <span style="color:#38bdf8;">${esc(l.device_id||'-')}</span> <span style="color:#cbd5e1;">${esc(l.message||'')}</span></div>`;
        }).join('');
        if(document.getElementById('logAuto').checked) box.scrollTop = box.scrollHeight;
      } catch(e){
        box.innerHTML = '<div style="color:var(--danger);text-align:center;padding:20px;">日志加载异常</div>';
      }
    }

    loadAll();
    loadLogs(true);
    setInterval(loadAll, 10000);  // 每 10 秒自动刷新设备
    setInterval(loadLogs, 10000); // 每 10 秒自动刷新日志
  </script>
  <script src="/static/sidebar.js"></script>
</body>
</html>
